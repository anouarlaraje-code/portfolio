<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Illustration of a laptop showing code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#101823"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#0b1219"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c384c"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 120 H900 M0 240 H900 M0 360 H900 M0 480 H900"/>
    <path d="M150 0 V620 M300 0 V620 M450 0 V620 M600 0 V620 M750 0 V620"/>
  </g>

  <!-- glow -->
  <circle cx="450" cy="300" r="250" fill="#1a63f0" fill-opacity="0.10"/>

  <!-- laptop screen -->
  <rect x="180" y="110" width="540" height="330" rx="18" fill="url(#screen)" stroke="#2c384c" stroke-width="3"/>
  <!-- window bar -->
  <circle cx="212" cy="142" r="7" fill="#3b4a63"/>
  <circle cx="236" cy="142" r="7" fill="#3b4a63"/>
  <circle cx="260" cy="142" r="7" fill="#1a63f0"/>
  <path d="M180 170 H720" stroke="#222c3d" stroke-width="2"/>

  <!-- code lines -->
  <g>
    <rect x="212" y="196" width="120" height="12" rx="6" fill="#1a63f0"/>
    <rect x="344" y="196" width="180" height="12" rx="6" fill="#3b4a63"/>
    <rect x="236" y="228" width="220" height="12" rx="6" fill="#4a86ff" fill-opacity="0.7"/>
    <rect x="468" y="228" width="90" height="12" rx="6" fill="#3b4a63"/>
    <rect x="236" y="260" width="140" height="12" rx="6" fill="#3b4a63"/>
    <rect x="388" y="260" width="200" height="12" rx="6" fill="#1a63f0" fill-opacity="0.55"/>
    <rect x="260" y="292" width="260" height="12" rx="6" fill="#3b4a63"/>
    <rect x="212" y="324" width="100" height="12" rx="6" fill="#4a86ff" fill-opacity="0.7"/>
    <rect x="324" y="324" width="160" height="12" rx="6" fill="#3b4a63"/>
    <rect x="212" y="356" width="72" height="12" rx="6" fill="#1a63f0"/>
  </g>
  <!-- blinking caret -->
  <rect x="296" y="352" width="4" height="20" rx="2" fill="#ffffff"/>

  <!-- laptop base -->
  <path d="M120 440 H780 L812 486 C816 494 810 502 800 502 H100 C90 502 84 494 88 486 Z" fill="url(#stand)"/>
  <rect x="392" y="452" width="116" height="10" rx="5" fill="#0f1720"/>

  <!-- floating badges -->
  <g font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600">
    <rect x="96" y="180" width="76" height="44" rx="12" fill="#141c27" stroke="#2c384c"/>
    <text x="134" y="209" text-anchor="middle" fill="#ffffff">&lt;/&gt;</text>
    <rect x="726" y="330" width="86" height="44" rx="12" fill="#141c27" stroke="#2c384c"/>
    <text x="769" y="359" text-anchor="middle" fill="#4a86ff">{ }</text>
  </g>
</svg>