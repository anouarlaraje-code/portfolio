<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1720" />
    <meta
      name="description"
      content="Anouar Laraje - Full-Stack Web Developer (React, Next.js, Node.js, PHP/Laravel) based in Meknes, Morocco. Available for a one-month internship starting January 2027."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Anouar Laraje | Full-Stack Web Developer</title>
    <script>
      // Apply the saved theme before the first paint so the page never flashes.
      (function () {
        var key = 'anouar-portfolio-theme';
        var theme = null;
        try {
          theme = window.localStorage.getItem(key);
        } catch (e) {
          /* storage unavailable (private mode) - fall back to system */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
