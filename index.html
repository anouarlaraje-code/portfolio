<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1720" />
    <meta
      name="description"
      content="Anouar Laraje - Full-Stack Web Developer (React, Next.js, Node.js, PHP/Laravel) based in Meknes, Morocco. Available for a one-month internship starting January 2027."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Anouar Laraje | Full-Stack Web Developer</title>
    <script>
      // Apply the saved theme and language before the first paint, so the page
      // never flashes the wrong colours or the wrong text direction.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('anouar-portfolio-theme');
        } catch (e) {
          /* storage unavailable (private mode) - fall back to system */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.dataset.theme = theme;

        var lang = null;
        try {
          lang = window.localStorage.getItem('anouar-portfolio-lang');
        } catch (e) {
          /* storage unavailable */
        }
        if (lang !== 'en' && lang !== 'fr' && lang !== 'ar') {
          var browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
          lang = browser === 'fr' || browser === 'ar' ? browser : 'en';
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
